# XenonRecomp configuration for Ace Combat 6: Fires of Liberation (default.xex)
# Image: base 0x82000000, size 0xAA0000, entry 0x821F5ED0
# Code sections: .text 0x82090000-0x823D0C6C, BINK 0x823D0E00-0x823E15F8

[main]
file_path = "../../default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "AC6_switch_tables.toml"

# Optimisations (see the XenonRecomp README).
skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = false   # off: SEH funclets get their frame pointer in r12 (e.g. sub_821FB21C)
non_volatile_as_local = true

# Register save/restore helpers (each byte pattern from the XenonRecomp README matched exactly once).
restgprlr_14_address = 0x82382A30
savegprlr_14_address = 0x823829E0
restfpr_14_address   = 0x82383F7C
savefpr_14_address   = 0x82383F30
restvmx_14_address   = 0x823853E8
savevmx_14_address   = 0x82385150
restvmx_64_address   = 0x8238547C
savevmx_64_address   = 0x823851E4

# longjmp restores the jmp_buf and falls back to RtlUnwind. setjmp follows it (unreferenced in this build).
longjmp_address = 0x823CA690
setjmp_address  = 0x823CA9B0

# Hook gates (AC6, tools/XenonRecomp): every function checks a slot of its own on entry, so mods can hook any function at
# runtime (GracemeriaRecomp/src/mods/hooks.h). An unhooked function pays a load and a branch. hook_gate_exclude lists
# functions to leave without a gate.
hook_gates = true
hook_gate_exclude = []

# Functions with an exception handler (.pdata ExceptionFlag) are preceded by 8 bytes of data:
# the handler address and its scope table. Skip them so the linear sweep doesn't decode them
# as code and spawn bogus overlapping functions.
invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    { data = 0x823D02EC, size = 8 }, # __C_specific_handler (33 functions)
    { data = 0x82384CD0, size = 8 }, # Frame handler (5 functions)
    { data = 0x8238F420, size = 8 }, # Frame handler (1 function)
]

# Functions that use registers outside the ABI keep the non-volatile registers in the context: SEH
# funclets (entered with the parent frame in r12 or another register, using the parent's registers) and
# their callers, and every function touching v92-v96 (the game keeps its current matrix in v92-v95 across
# calls). Found by scanning the image for SEH funclets and for functions that read non-volatile registers they
# didn't save.
